<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search and read all 984 hymns in the Methodist Hymn Book." />
    <title>Hymn Book | Maranatha MYF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script>
      document.documentElement.classList.add('js', 'page-loading');
      window.setTimeout(function () {
        document.documentElement.classList.remove('page-loading');
      }, 4000);
    </script>
  </head>
  <body class="hymnal-page">
    <div class="page-loader" id="pageLoader" role="status" aria-live="polite" aria-label="Loading">
      <div class="loader-inner">
        <img src="assets/Emblem.jpeg" alt="Methodist Youth Fellowship" class="loader-emblem" />
        <div class="loader-bar" aria-hidden="true">
          <span class="loader-fill" id="loaderBar"></span>
        </div>
      </div>
    </div>

    <header class="hymnal-topbar">
      <div class="hymnal-topbar-inner">
        <a class="hymnal-back" href="index.html" aria-label="Back to Maranatha Youth Fellowship">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
          <span>Back to Maranatha</span>
        </a>
        <a class="hymnal-brand" href="index.html" aria-label="Maranatha Youth Fellowship home">
          <img src="assets/Emblem.jpeg" alt="" />
          <span><strong>Methodist Youth</strong><small>Maranatha Society</small></span>
        </a>
      </div>
    </header>

    <main id="hymns" class="hymnal-workspace">
      <div class="hymnal-intro">
        <p class="eyebrow">Methodist Hymn Book · 984 hymns</p>
        <h1>Find a hymn</h1>
        <p>Search by hymn number, title, lyric, or author.</p>
      </div>

      <div class="hymn-controls">
        <label class="hymn-search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input
            type="search"
            id="hymnSearch"
            placeholder="Try a title, lyric, author, or MHB number"
            aria-label="Search the Methodist Hymn Book"
            autocomplete="off"
          />
        </label>
        <div class="hymn-count" id="hymnCount" role="status" aria-live="polite"></div>
      </div>

      <div class="hymnal-results-heading">
        <h2>Hymns</h2>
      </div>
      <div class="hymn-grid" id="hymnGrid" aria-live="polite"></div>
    </main>

    <div
      class="hymn-view"
      id="hymnView"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="hymnViewTitle"
    >
      <div class="hymn-view-panel">
        <button class="hymn-view-close" id="hymnViewClose" aria-label="Close hymn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>

        <div class="hymn-view-head">
          <span class="hymn-view-num" id="hymnViewNum"></span>
          <h3 class="hymn-view-title" id="hymnViewTitle"></h3>
          <p class="hymn-view-author" id="hymnViewAuthor"></p>
        </div>

        <div class="hymn-view-body" id="hymnViewBody"></div>

        <div class="hymn-view-nav">
          <button type="button" class="hymn-nav-btn" id="hymnPrev" aria-label="Previous hymn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
            Previous
          </button>
          <span class="hymn-nav-pos" id="hymnViewPos"></span>
          <button type="button" class="hymn-nav-btn" id="hymnNext" aria-label="Next hymn">
            Next
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script src="hymns.js"></script>
    <script src="script.js"></script>
  </body>
</html>
